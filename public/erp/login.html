<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 远帆 ERP</title><link rel="stylesheet" href="login.css"></head><body><div class="login-layout"><section class="intro"><div class="brand">↗ 远帆 <small>ERP</small></div><div><span class="eyebrow">YOUR BUSINESS, CONNECTED</span><h1>从一份报价，<br>到每一次出航。</h1><p>采购、库存、报价与出货，<br>在独立的工作空间里井然有序。</p><div class="features"><span>独立账号与权限</span><span>发票与装箱单联动</span><span>业务数据安全隔离</span></div></div><small>YUANFAN · TRADE OPERATIONS</small></section><main><div class="login-card"><span class="eyebrow">WELCOME BACK</span><h2>登录你的工作空间</h2><p class="sub">使用管理员为你创建的账号和密码</p><form id="loginForm"><label>账号<input id="login" autocomplete="username" placeholder="请输入账号" required maxlength="254"></label><label id="passwordField">密码<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="128" required></label><button id="submitLogin" class="primary" type="submit">登录</button><p id="notice" role="status"></p></form><p class="tip">不开放自行注册。子账号由管理员创建，忘记密码请联系管理员。<br>主用与备用管理员共享管理权限，子账号数据相互独立。</p><div id="configuration" hidden>当前为待配置版本，暂不能验证账号密码。请先完成身份验证服务及独立部署配置。</div></div><footer>主账号统一授权 · 子账号独立工作</footer></main></div><script src="login.js"></script></body></html>
